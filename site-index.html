<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بيت الوقاية | مركز الحجامة وتقويم العظام في الدار البيضاء</title>
  <link rel="canonical" href="https://baytwikaya.site/">
  <meta http-equiv="refresh" content="0; url=https://baytwikaya.site/">
  <script>window.location.replace("https://baytwikaya.site/");</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "83ee3272-f71f-4f26-8d5d-3ca2423038e7",
    });
  });
</script>
</head>
<body>
  <p>جاري التحويل إلى <a href="https://baytwikaya.site/">الصفحة الرئيسية</a>…</p>
<!-- Cookie consent (Consent Mode v2) -->
<div id="bayt-cookie-banner" dir="rtl" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#0b3d2e;color:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.25);">
  <div style="max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13.5px;line-height:1.6;">
    <p style="margin:0;flex:1 1 280px;">نستعمل ملفات تعريف الارتباط (الكوكيز) لتحسين تجربتك وقياس الزيارات وعرض إعلانات مناسبة. يمكنك القبول أو الرفض. <a href="/privacy.html" style="color:#e7c65a;text-decoration:underline;">سياسة الخصوصية</a></p>
    <button type="button" data-cookie-choice="accepted" style="cursor:pointer;border:0;border-radius:999px;background:#c9a227;color:#1a1a1a;font-weight:700;font-size:13.5px;padding:8px 18px;">قبول الكل</button>
    <button type="button" data-cookie-choice="declined" style="cursor:pointer;border:1px solid rgba(255,255,255,.7);border-radius:999px;background:transparent;color:#fff;font-weight:700;font-size:13.5px;padding:8px 18px;">رفض</button>
  </div>
</div>
<script>
(function(){
  var KEY='bayt-cookie-consent';
  function setConsent(v){ if(typeof gtag==='function'){ gtag('consent','update',{'analytics_storage':v,'ad_storage':v,'ad_user_data':v,'ad_personalization':v}); } }
  var banner=document.getElementById('bayt-cookie-banner');
  if(!banner){ return; }
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved==='accepted'){ setConsent('granted'); return; }
  if(saved==='declined'){ setConsent('denied'); return; }
  banner.style.display='block';
  banner.addEventListener('click',function(ev){
    var b=ev.target.closest ? ev.target.closest('[data-cookie-choice]') : null;
    if(!b){ return; }
    var choice=b.getAttribute('data-cookie-choice');
    try{ localStorage.setItem(KEY,choice); }catch(e){}
    setConsent(choice==='accepted'?'granted':'denied');
    banner.style.display='none';
  });
})();
</script>
</body>
</html>
